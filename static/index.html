<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>苏州轨道交通智能客服 · kefu-next</title>
<style>
  :root { --main:#0F62FE; --ink:#1f2329; --soft:#646a73; --bg:#f5f7fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; flex-direction:column; }
  header { background:#fff; border-bottom:1px solid #e5e6eb; padding:14px 20px; display:flex; align-items:center; gap:10px; }
  header .logo { width:34px; height:34px; border-radius:9px; background:var(--main); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  header h1 { font-size:16px; margin:0; }
  header small { color:var(--soft); }
  main { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:78%; margin:0 0 14px; padding:10px 14px; border-radius:14px; line-height:1.6; font-size:14.5px; white-space:pre-wrap; word-break:break-word; }
  .user { margin-left:auto; background:var(--main); color:#fff; border-bottom-right-radius:4px; }
  .bot { background:#fff; border:1px solid #e5e6eb; border-bottom-left-radius:4px; }
  .refs { margin-top:8px; padding-top:6px; border-top:1px dashed #e5e6eb; font-size:12px; color:var(--soft); }
  .refs summary { cursor:pointer; color:var(--main); }
  footer { background:#fff; border-top:1px solid #e5e6eb; padding:12px 16px; display:flex; gap:10px; }
  textarea { flex:1; resize:none; border:1px solid #e5e6eb; border-radius:10px; padding:10px 12px; font:inherit; font-size:14.5px; height:46px; outline:none; }
  textarea:focus { border-color:var(--main); }
  button { border:0; background:var(--main); color:#fff; border-radius:10px; padding:0 20px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { text-align:center; color:var(--soft); font-size:12px; padding:4px 0 10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 8px; background:#fff; }
  .chip { font-size:12.5px; color:var(--main); background:#f0f5ff; border:1px solid #d6e4ff; border-radius:999px; padding:5px 12px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="logo">苏</div>
  <div><h1>苏州轨道交通智能客服 <small>v1 · kefu-next</small></h1></div>
</header>
<main id="list"></main>
<div class="chips" id="chips"></div>
<div class="hint">内容由 AI 生成，仅供参考 · 服务热线 0512-69899000</div>
<footer>
  <textarea id="input" placeholder="请输入您的问题，Enter 发送"></textarea>
  <button id="send">发送</button>
</footer>
<script>
const $ = id => document.getElementById(id);
const sid = 's-' + Math.random().toString(36).slice(2, 10);
const QUICK = ['首末班车是几点？', '票价怎么算？', '丢失物品怎么找？', '无障碍服务有哪些？'];
function bubble(role, text, refs) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (refs && refs.length) {
    const d = document.createElement('details'); d.className = 'refs';
    d.innerHTML = `<summary>参考来源 · 官方FAQ ${refs.length} 条</summary>` +
      refs.map(r => `<div>《${r.question}》${r.answer.slice(0, 60)}…</div>`).join('');
    div.appendChild(d);
  }
  $('list').appendChild(div); $('list').scrollTop = 1e9;
}
async function send(text) {
  if (!text || $('send').disabled) return;
  bubble('user', text); $('input').value = ''; $('send').disabled = true;
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session_id: sid, message: text }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    bubble('bot', d.answer, d.refs);
  } catch (e) { bubble('bot', '出了点问题：' + e.message); }
  $('send').disabled = false; $('input').focus();
}
QUICK.forEach(q => { const b = document.createElement('div'); b.className='chip'; b.textContent=q;
  b.onclick = () => send(q); $('chips').appendChild(b); });
$('send').onclick = () => send($('input').value.trim());
$('input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftIsDefault) { e.preventDefault(); send($('input').value.trim()); } };
bubble('bot', '您好，我是苏州轨道交通智能客服，请问有什么可以帮您？');
</script>
</body>
</html>
